<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн лаборатория алгоритмов · Кабинет</title><style>body{font:16px/1.6 system-ui;margin:0;background:#f1f5ee;color:#243d30}main{max-width:1100px;margin:auto;padding:25px}section{background:white;border-radius:12px;padding:22px;margin:18px 0}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #bacdb2;border-radius:6px}button{cursor:pointer;background:#e3eedb}textarea{display:block;width:95%}label{display:block;margin:8px 0}iframe{width:100%;height:85vh;border:0}a{color:#245e46}.error{color:#a63827}pre{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:12px;flex-wrap:wrap}.lesson{padding:8px;border-bottom:1px solid #eee}small{color:#63735c}</style><main><h1>Онлайн лаборатория алгоритмов</h1><div id="app"></div></main><script>
const app=document.querySelector('#app'),names=['Максимум и повторения','Возрастающий участок','Локальные максимумы','Скользящее окно','Увеличение между соседями'],labels=['Исследование массива','Правило','Предскажи шаг','Собери программу','Проверочные тесты','Исправь ошибку','Олимпиадная задача','Усложнение 1 · дополнительное','Усложнение 2 · дополнительное','Контрпример · необязательное'];let me,studentId,students=[];
const ids=t=>[t*4,t*4+1,40+t,t*4+2,t*4+3,35+t,30+t,20+t*2,21+t*2,45+t],esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function report(e){alert(e.message)}
async function start(){try{if(location.hash){let key=location.hash.slice(1);history.replaceState(null,'',location.pathname);await api('login',{key})}me=await api('me');if(me.role==='teacher')await teacher();else await pupil()}catch(e){app.innerHTML='<section><p>'+esc(e.message)+'</p><label>Ключ учителя<input id="key" type="password"></label><button id="login">Войти</button></section>';document.querySelector('#login').onclick=async()=>{try{await api('login',{key:document.querySelector('#key').value});start()}catch(e){report(e)}}}}
async function teacher(){students=await api('students');app.innerHTML=`<section><h2>Кабинет учителя</h2><p>Создайте ученика и передайте ему личную ссылку. В ссылке содержится ключ доступа к его кабинету. Данные хранятся на этом школьном сервере.</p><div class="row"><input id="name" placeholder="Имя ученика"><select id="variant"><option value="0">Вариант 1</option><option value="1">Вариант 2</option></select><button id="create">Добавить ученика</button></div><p id="link"></p></section><section><h2>Ученики</h2>${students.map(s=>`<p><button data-student="${s.id}">${esc(s.name)}</button> · вариант ${s.variant+1} · ${s.active?'активен':'доступ отозван'}</p>`).join('')||'Пока нет учеников'}</section><div id="details"></div>`;document.querySelector('#create').onclick=async()=>{try{let r=await api('students',{name:document.querySelector('#name').value,variant:+document.querySelector('#variant').value});await teacher();showLink(r.link)}catch(e){report(e)}};document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>edit(+b.dataset.student).catch(report))}
function showLink(link){let url=location.origin+link;document.querySelector('#link').innerHTML='Личная ссылка (сохраните и передайте ученику): <a href="'+esc(url)+'">'+esc(url)+'</a>'}
async function edit(id){studentId=id;let d=await api('student/'+id),s=students.find(s=>s.id===id);document.querySelector('#details').innerHTML=`<section><h2>${esc(s.name)}</h2><label>Вариант сборки программы<select id="assignedVariant"><option value="0">Вариант 1</option><option value="1">Вариант 2</option></select></label><p>Задания №8 и №9 — дополнительные для сильных учеников. Открываются только по вашему выбору.</p>${names.map((n,t)=>`<details><summary>${n}</summary><label>Теоретический материал<textarea data-theory="${t}" rows="5">${esc(d.theory.find(v=>v.topic===t)?.text||'')}</textarea></label>${ids(t).map((lesson,j)=>`<label class="lesson"><input type="checkbox" data-grant="${lesson}" ${d.lessons.includes(lesson)?'checked':''}> №${j+1}. ${labels[j]}</label>`).join('')}</details>`).join('')}<div class="row"><button id="save">Сохранить назначения и теорию</button><button id="rotate">Выдать новую ссылку</button><button id="revoke">Отозвать доступ</button></div><p id="saved" role="status"></p></section><section><h2>Результаты</h2><p>Верных: ${d.attempts.filter(r=>r.correct).length}; с ошибкой: ${d.attempts.filter(r=>!r.correct).length}. Это результаты интерактивной проверки в браузере, а не независимая оценка Python-программы.</p>${d.attempts.map(r=>`<details><summary>${esc(new Date(r.created*1000).toLocaleString('ru-RU'))} · задание ${r.lesson} · ${r.correct?'1 / 1':'0 / 1'}</summary><pre>${esc(r.answer)}</pre></details>`).join('')}</section>`;document.querySelector('#assignedVariant').value=s.variant;document.querySelector('#save').onclick=async()=>{try{await api('assign',{student:id,variant:+document.querySelector('#assignedVariant').value,lessons:[...document.querySelectorAll('[data-grant]:checked')].map(e=>+e.dataset.grant),theory:[...document.querySelectorAll('[data-theory]')].map(e=>({topic:+e.dataset.theory,text:e.value}))});document.querySelector('#saved').textContent='Сохранено'}catch(e){report(e)}};document.querySelector('#rotate').onclick=async()=>{try{let r=await api('rotate',{student:id});showLink(r.link)}catch(e){report(e)}};document.querySelector('#revoke').onclick=async()=>{try{await api('revoke',{student:id});document.querySelector('#saved').textContent='Доступ отозван, прежняя ссылка и сессия больше не действуют.'}catch(e){report(e)}}}
async function pupil(){app.innerHTML=`<section><h2>Личный кабинет: ${esc(me.name)}</h2><p>Вариант ${me.variant+1}. Учитель открывает задания и размещает теорию. Чтобы получить новые назначения, обновите страницу.</p>${names.map((n,t)=>`<details><summary>${n}</summary><h3>Теория от учителя</h3><p style="white-space:pre-wrap">${esc(me.theory.find(v=>v.topic===t)?.text||'Материал пока не выдан.')}</p>${ids(t).map((lesson,j)=>`<p>${me.lessons.includes(lesson)?`<button data-task="${lesson}">№${j+1}. ${labels[j]}</button>`:`<small>№${j+1}. ${labels[j]} · не выдано</small>`}</p>`).join('')}</details>`).join('')}</section><section id="frameHost" hidden><iframe title="Задание" id="course"></iframe></section>`;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{document.querySelector('#frameHost').hidden=false;document.querySelector('#course').src='/course/index.html#'+b.dataset.task;document.querySelector('#frameHost').scrollIntoView({behavior:'smooth'})})}
start();
</script></html>
